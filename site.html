<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laborator TW - Adrian's Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Proiect Jocuri Interactive</h1>
        <p>Inspirat de neal.fun - Lucrarea de Laborator Nr. 1</p>
    </header>

    <main>
        <!-- Secțiunea 1: Random Number Generator -->
        <section id="number-generator">
            <h2>Random Number Generator</h2>
            <div class="display" id="number-display">0</div>
            <button id="btn-generate-number">Generează Număr</button>
        </section>

        <hr>

        <!-- Secțiunea 2: Random Color Generator -->
        <section id="color-generator">
            <h2>Random Color Generator</h2>
            <div id="color-box" style="width: 100px; height: 100px; border: 1px solid #000; margin: 10px 0;"></div>
            <p id="color-code">#FFFFFF</p>
            <button id="btn-generate-color">Schimbă Culoarea</button>
        </section>

        <hr>

        <!-- Placeholder pentru jocurile viitoare (2048, Reaction Time) -->
        <section id="upcoming">
            <h2>Jocuri în curând...</h2>
            <ul>
                <li>Reaction Time (Coming soon)</li>
                <li>2048 (Coming soon)</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Proiect Tehnologii Web</p>
    </footer>
<script src="script.js"></script>
</body>
</html>
